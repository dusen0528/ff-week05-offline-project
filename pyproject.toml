[project]
name = "ff-report"
version = "0.1.0"
description = "세무조정계산서 PDF 2개(전기·당기)로 법인세 분석 보고서 PDF·Excel과 조정료청구서 초안을 만든다"
authors = [
    { name = "inho", email = "dusen0528@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.4",
    "reportlab>=5.1.0",
]

[project.scripts]
ff-report = "ff_report:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"
